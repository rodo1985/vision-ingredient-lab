[project]
name = "vision-ingredient-lab"
version = "0.1.0"
description = "Backend and frontend prototype for ingredient image analysis and creative generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0,<3.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.23.0,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
